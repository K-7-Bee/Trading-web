<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1316"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}</style>
<title>Disciplined Trading Assistant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column on phones; nav rail + card/detail columns on wide windows. Dark by default. */
:root {
  --bg:#0e1316; --surface:#161c20; --surface2:#1d2529; --line:#2a353b; --fg:#e7edef; --muted:#93a4ac;
  --buy:#45c283; --buy-bg:#112a1f; --short:#ee6a55; --short-bg:#33171a; --exit:#e6b04a; --exit-bg:#33280f;
  --wait:#7fa6c4; --wait-bg:#16222c; --stop:#c9a0e8; --stop-bg:#241a30; --focus:#7fd0c3; --btn:#e7edef; --btn-fg:#0e1316; --danger:#e5483a;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"] {
  --bg:#f3f6f7; --surface:#ffffff; --surface2:#e9eff1; --line:#cfdadd; --fg:#12191c; --muted:#53666e;
  --buy:#13804a; --buy-bg:#e0f3e8; --short:#b8321f; --short-bg:#fbe5e0; --exit:#8a5b00; --exit-bg:#fbefd2;
  --wait:#2d5e82; --wait-bg:#e1edf6; --stop:#6b3f93; --stop-bg:#efe5f7; --focus:#0b7d70; --btn:#12191c; --btn-fg:#f3f6f7; --danger:#c4291b;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr);max-width:1180px;margin:0 auto;padding-bottom:96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-weight:700;letter-spacing:.01em;font-size:15px;min-width:0}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid currentColor;text-transform:uppercase;letter-spacing:.06em}
.badge.demo{color:var(--stop)}.badge.replay{color:var(--exit)}.badge.latest{color:var(--buy)}
.pause{min-height:52px;padding:0 20px;border-radius:12px;border:0;background:var(--danger);color:#fff;font-weight:700;letter-spacing:.04em;cursor:pointer;font-size:15px}
.pause.on{background:var(--btn);color:var(--btn-fg)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{min-height:56px;background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;padding:6px 2px}
.nav button[aria-current="page"]{color:var(--fg);box-shadow:inset 0 3px 0 var(--focus)}
.nav kbd{display:none}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px;font-weight:600}
h3{font-size:17px;margin:0 0 6px}
p{margin:0 0 10px}
.meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.card{border-radius:20px;padding:26px 22px;border:2px solid var(--c,var(--line));background:var(--cbg,var(--surface))}
.card .tag{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.card .big{font-size:clamp(34px,9vw,60px);line-height:1.04;font-weight:700;margin:10px 0 2px;color:var(--c);text-wrap:balance}
.card .sub{font-size:clamp(18px,4.5vw,24px);font-weight:600;color:var(--c);margin:0 0 14px}
.card .why{font-size:18px;max-width:60ch}
.card .rr{margin-top:14px;font-size:17px;font-weight:600}
.k-long{--c:var(--buy);--cbg:var(--buy-bg)}.k-short{--c:var(--short);--cbg:var(--short-bg)}.k-exit{--c:var(--exit);--cbg:var(--exit-bg)}
.k-wait,.k-holding,.k-norec{--c:var(--wait);--cbg:var(--wait-bg)}.k-stop,.k-paused{--c:var(--stop);--cbg:var(--stop-bg)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{min-height:52px;padding:0 20px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 18px}
.kv div{min-width:0}.kv .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.kv .v{font-family:var(--mono);font-size:19px;font-weight:600;overflow-wrap:anywhere}
.note{font-size:14px;color:var(--muted)}
.warn{border-left:4px solid var(--exit);background:var(--exit-bg);padding:12px 14px;border-radius:8px;font-size:14.5px}
.warn.demo{border-color:var(--stop);background:var(--stop-bg)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.stat .n{font-family:var(--mono);font-size:26px;font-weight:600}.stat .t{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.stat p{font-size:14px;color:var(--muted);margin:6px 0 0}
.good{color:var(--buy)}.bad{color:var(--short)}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left;white-space:normal}
.tl{display:flex;flex-direction:column;gap:8px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;overflow-wrap:anywhere}
.ev .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.chip{font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--line)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;min-width:0}
label.f span.d{font-size:12.5px;color:var(--muted)}
input[type=number],select{min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);padding:0 12px;width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
ul.tight{margin:0 0 10px;padding-left:20px}ul.tight li{margin:4px 0}
.rules li b{font-family:var(--mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btn-fg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}
.keys{display:none}
@media (min-width:900px){
  .app{grid-template-columns:200px minmax(0,1fr);column-gap:32px;padding-bottom:40px}
  .top{grid-column:1/-1}
  .nav{position:sticky;top:96px;align-self:start;grid-template-columns:1fr;border:1px solid var(--line);border-radius:16px;padding:8px;left:auto;right:auto;bottom:auto;gap:2px}
  .nav button{text-align:left;padding:0 14px;font-size:15px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
  .nav button[aria-current="page"]{background:var(--surface2);box-shadow:none}
  .nav kbd{display:inline;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .toast{bottom:24px}.keys{display:block}
  .today{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
  .today .full{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){.card{transition:background .2s,border-color .2s}}
</style>
<div class="app" id="app"></div>
<script src="engine.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});</script></body></html>
